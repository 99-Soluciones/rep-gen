packages:
  - repgen-backend
  - repgen-frontend
  - packages/*

# Fusion de los settings que vivian en los pnpm-workspace.yaml de cada app
allowBuilds:
  '@nestjs/core': true
  '@nestjs/cli': true
  unrs-resolver: true
  '@parcel/watcher': false

overrides:
  js-yaml: ^5.2.1
  # GHSA-q7qp-rjg7-q26m: @nestjs/platform-express pins multer@2.4.0; drop once Nest ships >=2.5.0
  multer: ^2.5.0

# @nestjs/platform-express@12 importa rxjs sin declararlo: con node_modules
# aislado de pnpm el backend no arranca ("No driver (HTTP) has been selected").
# Como peer usa el rxjs del backend; quitar cuando Nest lo declare.
packageExtensions:
  '@nestjs/platform-express@12':
    peerDependencies:
      rxjs: ^7.8.0

minimumReleaseAge: 10080
# Parches de seguridad que aun no cumplen la ventana de 7 dias. Quitar cada
# uno al cumplirla: fast-uri 3.1.9 (19-oct), multer 2.5.0 y body-parser 2.4.0
# (22-oct). Exentar un paquete sin version exenta todas sus versiones futuras.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9
  - multer@2.5.0
  - body-parser@2.4.0
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
